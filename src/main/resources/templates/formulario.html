<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Producto</title>
</head>
<body>

<h1>Nuevo Producto</h1>

<form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

    <input type="hidden" th:field="*{id}"/>

    <label>Nombre:</label><br>
    <input type="text" th:field="*{nombre}" required><br><br>

    <label>Precio:</label><br>
    <input type="number" step="0.01" th:field="*{precio}" required><br><br>

    <button type="submit">Guardar</button>

</form>

<br>

<a th:href="@{/productos}">Volver al listado</a>

</body>
</html>
