<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Producto - Hoodies District</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            <h2 class="text-center mb-0">
                Registrar Producto
            </h2>
        </div>

        <div class="card-body">

            <form th:action="@{/productos/guardar}"
                  th:object="${producto}"
                  method="post">

                <!-- NOMBRE -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input type="text"
                           id="nombre"
                           class="form-control"
                           th:field="*{nombre}"
                           required>
                </div>

                <!-- PRECIO -->
                <div class="mb-3">
                    <label for="precio" class="form-label">
                        Precio
                    </label>

                    <input type="number"
                           id="precio"
                           step="0.01"
                           min="0"
                           class="form-control"
                           th:field="*{precio}"
                           required>
                </div>

                <!-- CANTIDAD -->
                <div class="mb-3">
                    <label for="cantidad" class="form-label">
                        Cantidad
                    </label>

                    <input type="number"
                           id="cantidad"
                           min="0"
                           class="form-control"
                           th:field="*{cantidad}"
                           required>
                </div>

                <!-- CATEGORÍA -->
                <div class="mb-3">
                    <label for="categoria" class="form-label">
                        Categoría
                    </label>

                    <select id="categoria"
                            class="form-select"
                            th:field="*{categoria}"
                            required>

                        <option value="">
                            Seleccione una categoría
                        </option>

                        <option value="Hoodies">
                            Hoodies
                        </option>

                        <option value="Sudaderas">
                            Sudaderas
                        </option>

                        <option value="Camisetas">
                            Camisetas
                        </option>

                        <option value="Pantalones">
                            Pantalones
                        </option>

                        <option value="Conjuntos">
                            Conjuntos
                        </option>

                    </select>
                </div>

                <!-- BOTONES -->
                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-success">
                        Guardar
                    </button>

                    <a th:href="@{/productos}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
